<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="commSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="commGround" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="260" fill="url(#commSky)" />
  
  <!-- City Skyline Silhouette in background -->
  <g fill="#0369a1" opacity="0.4">
    <rect x="50" y="110" width="45" height="150" />
    <rect x="110" y="80" width="60" height="180" />
    <rect x="180" y="130" width="50" height="130" />
    <rect x="250" y="70" width="75" height="190" />
    <rect x="340" y="100" width="55" height="160" />
    <rect x="420" y="60" width="80" height="200" />
    <rect x="520" y="120" width="60" height="140" />
    <rect x="600" y="90" width="70" height="170" />
    <rect x="690" y="130" width="55" height="130" />
  </g>
  
  <!-- Commercial Land Plot (Paved/Fill) -->
  <polygon points="100,270 700,270 780,430 20,430" fill="url(#commGround)" />
  <polygon points="110,275 690,275 765,420 35,420" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="10 8" />
  
  <!-- Front Wide Highway -->
  <polygon points="0,440 800,440 800,500 0,500" fill="#1e293b" />
  <line x1="0" y1="470" x2="800" y2="470" stroke="#facc15" stroke-width="4" stroke-dasharray="30 20" />
  
  <!-- Signboard -->
  <g transform="translate(290, 290)">
    <rect x="0" y="0" width="220" height="85" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.2))" />
    <rect x="105" y="85" width="10" height="45" fill="#475569" />
    <text x="110" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">OFFICER VERIFIED</text>
    <text x="110" y="47" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#0f172a" text-anchor="middle">COMMERCIAL PLOT</text>
    <text x="110" y="68" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle">60 FT HIGHWAY FRONTAGE</text>
  </g>
</svg>
